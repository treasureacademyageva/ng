<script>
(function(){
  const db = DB.load();
  const pages = db.classPages || [];
  const want = new URLSearchParams(location.search).get("class");
  const cp = pages.find(p => p.class === want && p.visible !== false);
  const body = document.getElementById("classBody");
  if(!cp){
    document.getElementById("classTitle").textContent = "Our Classes";
    body.innerHTML = `<div class="class-grid">` + pages.filter(p=>p.visible!==false).map(p=>`
      <a class="class-card" href="class.html?class=${encodeURIComponent(p.class)}">
        <h3>${U.esc(p.class)}</h3><p style="color:var(--muted);font-size:.88rem">${U.esc(p.tagline||"")}</p>
        <span style="color:#177A3F;font-weight:800;font-size:.88rem">Open class page →</span>
      </a>`).join("") + `</div>
      <div style="text-align:center;margin-top:26px"><a class="btn btn-mint" href="portal/login.html?mode=register">Enrol Your Child</a></div>`;
    return;
  }
  document.title = cp.class + " — Treasure Academy, Ageva";
  document.getElementById("classTitle").textContent = cp.class;
  document.getElementById("classTag").textContent = cp.tagline || "";
  const teacher = (db.teachers || []).find(t => t.class === cp.class);
  const nPupils = (db.pupils || []).filter(p => p.class === cp.class).length;
  const tt = U.getTimetable(db, cp.class), ttDays = Object.keys(tt);
  window._ttCls = cp.class;
  window.printTT = function(){
    const d=DB.load(), t=U.getTimetable(d,window._ttCls), slots=U.ttSlots();
    document.getElementById("printSlip").innerHTML=`<div class="slip"><div class="slip-head"><b>${U.esc(d.school.name)}</b><small>${U.esc(d.school.address||"")}</small></div><h3>TIMETABLE — ${U.esc(window._ttCls)}</h3><table class="slip-tbl items"><thead><tr><th>Day</th>${slots.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${Object.keys(t).map(dy=>`<tr><td><b>${dy}</b></td>${t[dy].map(x=>`<td>${U.esc(x)}</td>`).join("")}</tr>`).join("")}</tbody></table><p class="slip-note">"${U.esc(d.school.motto)}"</p></div>`;
    document.body.classList.add("printing"); window.print();
    setTimeout(()=>document.body.classList.remove("printing"),600);
  };
  window._cpCls = cp.class;
  window.printBrochure = function(){
    const d=DB.load(), pg=(d.classPages||[]).find(p=>p.class===window._cpCls)||{};
    const t=(d.teachers||[]).find(x=>x.class===window._cpCls)||{};
    const np=(d.pupils||[]).filter(p=>p.class===window._cpCls).length;
    const tm=U.getTimetable(d,window._cpCls), slots=U.ttSlots();
    document.getElementById("printSlip").innerHTML=`<div class="slip"><div class="slip-head"><b>${U.esc(d.school.name)}</b><small>${U.esc(d.school.address||"")} • ${U.esc(d.school.phone||"")}</small></div><h3>${U.esc(window._cpCls)} — CLASS BROCHURE</h3>
    <p><b>${U.esc(pg.tagline||"")}</b></p><p>${U.esc(pg.about||"")}</p>
    <table class="slip-tbl"><tr><td>Class Teacher</td><td><b>${U.esc(t.name||"—")}</b></td></tr><tr><td>Pupils</td><td><b>${np}</b></td></tr></table>
    <p><b>What we do:</b> ${(pg.activities||[]).map(a=>U.esc(a)).join(" • ")||"—"}</p>
    <table class="slip-tbl items"><thead><tr><th>Day</th>${slots.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${Object.keys(tm).map(dy=>`<tr><td><b>${dy}</b></td>${tm[dy].map(x=>`<td>${U.esc(x)}</td>`).join("")}</tr>`).join("")}</tbody></table>
    <p class="slip-note">Admissions open — "${U.esc(d.school.motto)}"</p></div>`;
    document.body.classList.add("printing"); window.print();
    setTimeout(()=>document.body.classList.remove("printing"),600);
  };
  body.innerHTML = `
    <img class="class-hero-img" src="${U.esc(cp.image || "assets/img/classroom.png")}" alt="${U.esc(cp.class)} classroom" onerror="this.style.display='none'" loading="lazy" decoding="async" style="aspect-ratio:16/9">
    <div class="p-grid2">
      <div class="panel"><h2>About ${U.esc(cp.class)}</h2><p>${U.esc(cp.about || "")}</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">
          <a class="btn btn-mint" href="portal/login.html?mode=register&class=${encodeURIComponent(cp.class)}">Enrol in ${U.esc(cp.class)}</a>
          <button class="btn btn-white" onclick="printBrochure()">Print Brochure</button>
          <a class="btn btn-white" href="shop.html?class=${encodeURIComponent(cp.class)}">Shop ${U.esc(cp.class)} Items</a>
        </div>
      </div>
      <div class="panel"><h2>Class Teacher</h2>
        ${teacher ? `<div style="display:flex;gap:12px;align-items:center"><div class="avatar" style="width:52px;height:52px;flex-basis:52px;background:${U.avatarColor(teacher.name)};font-size:1.1rem">${U.initials(teacher.name)}</div><div><b style="font-size:1.1rem">${U.esc(teacher.name)}</b><br><span style="color:var(--muted);font-size:.86rem">${U.esc((teacher.subjects||[]).join(", "))}</span></div></div>`
        : `<p style="color:var(--muted)">Class teacher to be announced.</p>`}
        <p style="margin-top:12px"><span class="badge b-green">${nPupils} pupil${nPupils===1?"":"s"}</span></p>
        <p class="sub">Admission into this class is approved by the headmistress after you apply.</p>
      </div>
    </div>
    <h2 style="margin-top:6px">What We Do in ${U.esc(cp.class)}</h2>
    <div class="act-grid">${(cp.activities||[]).map(a=>`<div class="act-card">${U.icon("check",18)} ${U.esc(a)}</div>`).join("")}</div>
    <div style="display:flex;align-items:center;gap:12px;margin-top:26px;flex-wrap:wrap"><h2 style="margin:0">Weekly Timetable</h2><span style="flex:1"></span><button class="btn btn-mint btn-sm" onclick="printTT()">Print Timetable</button></div>
    <div style="overflow-x:auto"><table class="tbl tt"><thead><tr><th>Day</th>${U.ttSlots().map(s=>`<th>${s}</th>`).join("")}</tr></thead><tbody>${ttDays.map(d=>`<tr><td>${d}</td>${tt[d].map(x=>`<td>${U.esc(x)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
    <div class="steps" style="margin-top:26px">
      <div class="step"><div class="num">1</div><h3>Apply</h3><p>Fill the 3-step form online in minutes.</p></div>
      <div class="step"><div class="num">2</div><h3>Get Approved</h3><p>The headmistress reviews and admits.</p></div>
      <div class="step"><div class="num">3</div><h3>Start Class</h3><p>Login details are sent to the parent.</p></div>
    </div>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:26px">
      <a class="btn btn-mint" href="portal/login.html?mode=register&class=${encodeURIComponent(cp.class)}">Enrol in ${U.esc(cp.class)}</a>
      <a class="btn btn-white" href="class.html">All Classes</a>
    </div>`;
})();
</script>
