<body data-page="openday" data-assets="assets/">
<div id="siteLoader"><img src="assets/img/logo.jpg" alt="Treasure Academy"><div class="spin"></div></div>
<div class="topbar"><div class="container">
  <div class="tb-contact"><span><b>Admissions</b> <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg><a data-school-phone aria-label="Call the school" href="tel:"></a></span><span class="tb-sep">•</span><span data-school-email></span></div>
  <div class="tb-right"><span>Ageva, Okene, Kogi State</span><a class="portal-link" href="portal/login.html">Portal Login</a></div>
</div></div>
<nav class="navbar"><div class="container">
  <a class="logo" aria-label="Treasure Academy — go to homepage" href="index.html">
    <img class="mark-img" src="assets/img/logo.jpg" alt="Treasure Academy logo">
    </a>
  <div class="brand-name"><span data-school-name></span><small>Creche to Primary 6</small></div>
  <div class="nav-links" id="navLinks"><div id="mainNav" style="display:contents"><a href="index.html">Home</a><a href="news.html">News/Event</a><a href="about.html">About Us</a><a href="contact.html">Contact Us</a><a href="portal/login.html" class="btn btn-mint btn-sm" style="margin-left:6px">Login/Register</a></div></div>

<div class="page-hero">
  <div class="container">
    <span class="sec-tag">Visit Us</span>
    <h1>Open Day</h1>
    <p>Tour our classrooms, meet the teachers, and see why parents trust Treasure Academy.</p>
  </div>
</div>
<section><div class="container" style="max-width:760px">
  <img class="page-banner" src="assets/img/openday-banner.png" alt="Parents touring Treasure Academy on open day">
  <div class="track-card clip-up" id="odCard"></div>
  <div class="track-card clip-up">
    <h3 style="margin-top:0">Reserve your seat (free)</h3>
    <div class="form-grid">
      <div class="field"><label>Your name *</label><input id="rsvName" placeholder="Parent name"></div>
      <div class="field"><label>Phone *</label><input id="rsvPhone" inputmode="tel" placeholder="080..."></div>
      <div class="field"><label>How many children?</label><input id="rsvKids" type="number" min="1" value="1"></div>
      <div class="field"><label>Class interested in</label><input id="rsvClass" placeholder="e.g. Nursery 1"></div>
    </div>
    <div style="margin-top:12px"><button class="btn btn-mint" onclick="sendRSVP()">Reserve Seat</button></div>
    <div id="rsvDone" style="margin-top:10px"></div>
  </div>
</div></section>
<footer id="siteFooter"></footer>
<div id="toast"></div>
<script src="assets/js/store.js?v=20260919-39"></script>
<script src="assets/js/sync.js?v=20260919-39"></script>
<script src="assets/js/site.js?v=20260919-39"></script>
<script>
(function(){
  const db = DB.load(), od = db.openday||{};
  document.getElementById("odCard").innerHTML = od.date ? `
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><span class="badge b-green">${U.prettyDate(od.date)}</span><span class="badge b-sun">${U.esc(od.time||"")}</span></div>
    <h3 style="margin:10px 0 4px">${U.esc(od.theme||"Open Day")}</h3>
    <p class="sub" style="margin:0">Venue: ${U.esc(od.venue||"School compound")}</p>`
    : '<div class="empty">Next open day date coming soon.</div>';
  window.sendRSVP = function(){
    const name = document.getElementById("rsvName").value.trim();
    const phone = document.getElementById("rsvPhone").value.trim();
    if(!name || !phone){ U.toast("Please add your name and phone number."); return; }
    const d = DB.load(); d.rsvps = d.rsvps||[];
    d.rsvps.unshift({id:"RS"+Date.now(), name, phone, kids:document.getElementById("rsvKids").value||"1", cls:document.getElementById("rsvClass").value.trim(), date:U.todayStr()});
    DB.save(d);
    document.getElementById("rsvDone").innerHTML = '<p style="color:var(--green);font-weight:700">Seat reserved! We look forward to seeing you, ' + U.esc(name) + '.</p>';
    document.getElementById("rsvName").value = ""; document.getElementById("rsvPhone").value = "";
    U.toast("RSVP received!");
  };
})();
</script>
</body>
</html>
