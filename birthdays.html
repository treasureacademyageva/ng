<script>
function bfmt(d){return d.toLocaleDateString("en-GB",{day:"numeric",month:"short"});}
function bnxt(dob){const p=dob.split("-");const t=new Date();t.setHours(0,0,0,0);let n=new Date(t.getFullYear(),+p[1]-1,+p[2]);if(n<t)n=new Date(t.getFullYear()+1,+p[1]-1,+p[2]);return n;}
const dd=DB.load();
document.getElementById("hmName").textContent=dd.school.headName||"Headmistress";
document.getElementById("hmBday").innerHTML=dd.school.headDob?(" "+bfmt(bnxt(dd.school.headDob))):"Date to be announced";
const list=(dd.teachers||[]).filter(t=>t.dob).map(t=>({name:t.name,role:t.class+" Class Teacher",d:bnxt(t.dob)})).sort((a,b)=>a.d-b.d);
const today=new Date().toDateString();
window._wishes=list.map(p=>p.name);
window.copyWish=function(i){ const name=window._wishes[i]||"our dear staff"; const msg="Happy Birthday, "+name+"! The whole Treasure Academy family celebrates you today. We wish you long life, good health and many happy returns.";
  try{ const d=DB.load(); d.bdayWishes=d.bdayWishes||{}; d.bdayWishes[name]=(d.bdayWishes[name]||0)+1; DB.save(d);
    const b=document.getElementById("wishN"+i); if(b)b.textContent=d.bdayWishes[name]; }catch(e){}
  const done=()=>U.toast("Birthday wish copied!"); if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(msg).then(done).catch(()=>U.toast(msg));}else{U.toast(msg);} };
window.playBday=function(){
  try{
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC){U.toast("Audio not supported on this device.");return;}
    var ctx=window._bctx||(window._bctx=new AC());
    if(ctx.state==="suspended")ctx.resume();
    var G4=392,A4=440,B4=493.88,C5=523.25,D5=587.33,E5=659.25,F5=698.46,G5=783.99,beat=0.42;
    var seq=[[G4,.75],[G4,.25],[A4,1],[G4,1],[C5,1],[B4,1.8],[0,.2],[G4,.75],[G4,.25],[A4,1],[G4,1],[D5,1],[C5,1.8],[0,.2],[G4,.75],[G4,.25],[G5,1],[E5,1],[C5,1],[B4,1],[A4,1.8],[0,.2],[F5,.75],[F5,.25],[E5,1],[C5,1],[D5,1],[C5,2]];
    var t=ctx.currentTime+0.05;
    seq.forEach(function(nd){ var f=nd[0],d=nd[1];
      if(f){var o=ctx.createOscillator(),g=ctx.createGain();o.type="triangle";o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.5,t+0.03);
      g.gain.exponentialRampToValueAtTime(0.0001,t+d*beat);
      o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+d*beat+0.02);}
      t+=d*beat; });
    U.toast("Happy Birthday to you!");
  }catch(e){ U.toast("Could not play the song."); }
};
(function(){ const th=(dd.bdayThanks||[]).filter(t=>t.date>=(()=>{const d=new Date();d.setDate(d.getDate()-7);return d.toISOString().slice(0,10);})());
  document.getElementById("thanksZone").innerHTML=th.length?th.map(t=>`<div class="track-card clip-up" style="border-left:6px solid #C9A227;margin-bottom:10px"><b>${U.esc(t.name)}</b> says thank you:<br>${U.esc(t.msg)}<br><small style="color:var(--muted)">${U.prettyDate(t.date)}</small></div>`).join(""):""; })();
document.getElementById("bdayGrid").innerHTML=list.map((p,i)=>{const isT=p.d.toDateString()===today;return `<div class="wish-bubble"><b class="who">${U.esc(p.name)}</b> <span class="when">• ${U.esc(p.role)} • ${isT?"BIRTHDAY TODAY!":bfmt(p.d)}</span><div style="margin-top:6px">Happy Birthday! The whole Treasure Academy family celebrates you today. We wish you long life, good health and many happy returns.</div><div style="margin-top:8px"><button class="btn btn-sun btn-sm" onclick="copyWish(${i})">Copy Wish</button> <span class="badge b-sun" title="Wishes sent">💌 <b id="wishN${i}">${(dd.bdayWishes||{})[p.name]||0}</b> wishes</span> <button class="btn btn-mint btn-sm" onclick="playBday()">Play Birthday Song</button></div></div>`;}).join("")||"<p class='sub'>Staff birthday dates coming soon.</p>";
</script>
