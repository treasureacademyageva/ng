<script>
document.addEventListener("DOMContentLoaded",function(){
  try{
    const db=DB.load(); const list=(db.testimonials||[]).filter(t=>t.status!=="Pending");
    document.getElementById("allTesti").innerHTML=list.length?list.map(t=>`
      <div class="testi-card clip-up" style="margin-bottom:14px"><div class="stars">${"★".repeat(t.stars||5)}</div>
      <p>"${U.esc(t.text)}"</p><b>— ${U.esc(t.name)}</b></div>`).join(""):
      `<div class="empty-state">No reviews yet — check back soon!</div>`;
  }catch(e){ document.getElementById("allTesti").innerHTML=`<div class="empty-state">Reviews are loading…</div>`; }
});
</script>
