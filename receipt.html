<div class="page-hero">
  <div class="container">
    <span class="sec-tag">Proof of Payment</span>
    <h1>Admission Form Receipt</h1>
    <p>Show this receipt at the school office. You can print it or share it on WhatsApp.</p>
  </div>
</div>
<section><div class="container" style="max-width:680px">
  <div id="rcptBox"><div class="empty">Loading receipt...</div></div>
</div></section>
<footer id="siteFooter"></footer>
<div id="toast"></div>
<script src="assets/js/store.js?v=20260919-39"></script>
<script src="assets/js/sync.js?v=20260919-39"></script>
<script src="assets/js/site.js?v=20260919-39"></script>
<script>
(function(){
  const q = (new URLSearchParams(location.search).get("r") || "").trim();
  const box = document.getElementById("rcptBox");
  const db = DB.load(), s = db.school || {};
  const c = (db.formClaims || []).find(x => x.receipt === q);
  if(!q || !c){
    box.innerHTML = '<div class="empty">Receipt not found on this device. Open the receipt link on the phone where you tracked your form, or ask the school office to re-confirm your payment.</div>'
      + '<div style="text-align:center;margin-top:12px"><a class="btn btn-mint btn-sm" href="admission-form.html">Track My Form</a></div>';
    return;
  }
  const shareTxt = s.name + " admission form receipt " + c.receipt + " (" + c.pupil + ", " + U.naira(+c.amount || 0) + "). View it here: " + location.href;
  box.innerHTML = `<div class="panel" style="position:relative;overflow:hidden">
    <div style="text-align:center;border-bottom:3px solid #14532D;padding-bottom:10px;margin-bottom:14px">
      <h2 style="margin:0;letter-spacing:1px">${U.esc(s.name || "").toUpperCase()}</h2>
      <div style="font-size:.8rem">&ldquo;${U.esc(s.motto || "")}&rdquo;</div>
      <div style="font-size:.8rem">${U.esc(s.address || "")} &bull; ${U.esc(s.phone || "")}</div>
    </div>
    <div style="position:absolute;top:18px;right:-32px;transform:rotate(35deg);background:#177A3F;color:#fff;font-weight:800;letter-spacing:.2em;font-size:.75rem;padding:5px 40px">PAID</div>
    <h3 style="text-align:center;text-decoration:underline;margin:0 0 10px">OFFICIAL RECEIPT</h3>
    <div class="ref-big" style="text-align:center">${U.esc(c.receipt)}</div>
    <table class="tbl" style="margin-top:12px"><tbody>
      <tr><th style="width:38%">Pupil</th><td><b>${U.esc(c.pupil || "")}</b></td></tr>
      <tr><th>Parent / Guardian</th><td>${U.esc(c.parent || "")} (${U.esc(c.phone || "")})</td></tr>
      <tr><th>Form Code</th><td>${U.esc(c.code || "")}</td></tr>
      <tr><th>Amount Paid</th><td><b>${U.naira(+c.amount || 0)}</b> — bank transfer</td></tr>
      <tr><th>Bank Ref</th><td>${U.esc(c.ref || "")}</td></tr>
      <tr><th>Date Confirmed</th><td>${U.esc(c.confirmedAt || c.submitted || "")}</td></tr>
    </tbody></table>
    <p style="font-size:.85rem;color:var(--muted)">Keep this receipt. You will show it at the school office when filling and submitting the admission form.</p>
    <div class="no-print" style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px">
      <button class="btn btn-mint btn-sm" onclick="window.print()">Print / Save PDF</button>
      <a class="btn btn-white btn-sm" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(shareTxt)}">Share on WhatsApp</a>
      <button class="btn btn-white btn-sm" onclick="copyRcptLink()">Copy Link</button>
    </div>
  </div>`;
  window.copyRcptLink = function(){
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(location.href).then(() => U.toast("Receipt link copied!")); }
    else { window.prompt("Copy receipt link:", location.href); }
  };
})();
</script>
</body>
