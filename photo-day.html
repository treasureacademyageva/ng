<body data-page="photoday" data-assets="assets/">
<div id="siteLoader"><img src="assets/img/logo.jpg" alt="Treasure Academy"><div class="spin"></div></div>
<div class="topbar"><div class="container">
  <div class="tb-contact"><span><b>Admissions</b> <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg><a data-school-phone href="tel:"></a></span><span class="tb-sep">•</span><span data-school-email></span></div>
  <div class="tb-right"><span>Ageva, Okene, Kogi State</span><a class="portal-link" href="portal/login.html">Portal Login</a></div>
</div></div>
<nav class="navbar"><div class="container">
  <a class="logo" href="index.html">
    <img class="mark-img" src="assets/img/logo.jpg" alt="Treasure Academy logo">
    </a>
  <div class="brand-name"><span data-school-name></span><small>Creche to Primary 6</small></div>
  <div class="nav-links" id="navLinks"><div id="mainNav" style="display:contents"><a href="index.html">Home</a><a href="news.html">News/Event</a><a href="about.html">About Us</a><a href="contact.html">Contact Us</a><a href="portal/login.html" class="btn btn-mint btn-sm" style="margin-left:6px">Login/Register</a></div></div>

<div class="page-hero">
  <div class="container">
    <span class="sec-tag">Portraits</span>
    <h1>Photo Day Booking</h1>
    <p>Pick a free time slot, add your child's name and class, and tap Book. Come in full school uniform!</p>
  </div>
</div>
<section><div class="container" style="max-width:820px">
  <img class="page-banner" src="assets/img/photoday-banner.png" alt="Portrait photo day at Treasure Academy">
  <div id="slotGrid" class="slot-grid"></div>
  <div class="track-card clip-up">
    <h3 style="margin-top:0">Book this slot</h3>
    <div class="form-grid">
      <div class="field"><label>Chosen slot</label><input id="pdSlot" readonly placeholder="Tap a free slot above"></div>
      <div class="field"><label>Pupil name *</label><input id="pdName" placeholder="Child's full name"></div>
      <div class="field"><label>Class *</label><input id="pdClass" placeholder="e.g. Primary 3"></div>
      <div class="field"><label>Parent phone *</label><input id="pdPhone" inputmode="tel" placeholder="080..."></div>
    </div>
    <div style="margin-top:12px"><button class="btn btn-mint" onclick="bookSlot()">Book Slot</button></div>
    <div id="pdDone" style="margin-top:12px"></div>
  </div>
</div></section>
<footer id="siteFooter"></footer>
<div id="toast"></div>
<script src="assets/js/store.js?v=20260919-17"></script>
<script src="assets/js/site.js?v=20260919-17"></script>
<script>
(function(){
  let picked = "";
  function render(){
    const db = DB.load();
    const grid = document.getElementById("slotGrid");
    grid.innerHTML = (db.photoSlots||[]).map(s=>`
      <div class="slot ${s.taken?"taken":""} ${picked===s.id?"picked":""}" ${s.taken?"":`onclick="pickSlot('${s.id}')" style="cursor:pointer"`}>
        <b>${U.esc(s.time)}</b><small>${U.esc(s.day)}</small><br>
        <small>${s.taken?"Taken":"Free — tap to pick"}</small>
      </div>`).join("") || '<div class="empty">No photo-day slots yet. Check back soon!</div>';
  }
  window.pickSlot = function(id){
    picked = id;
    const s = (DB.load().photoSlots||[]).find(x=>x.id===id);
    document.getElementById("pdSlot").value = s ? (s.day+" • "+s.time) : "";
    document.getElementById("pdSlot").dataset.id = id;
    render();
  };
  window.bookSlot = function(){
    const name = document.getElementById("pdName").value.trim();
    const cls = document.getElementById("pdClass").value.trim();
    const phone = document.getElementById("pdPhone").value.trim();
    const id = document.getElementById("pdSlot").dataset.id || picked;
    if(!id){ U.toast("Please tap a free slot first."); return; }
    if(!name || !cls || !phone){ U.toast("Pupil name, class and phone are required."); return; }
    const d = DB.load();
    const s = (d.photoSlots||[]).find(x=>x.id===id);
    if(!s || s.taken){ U.toast("Sorry, that slot was just taken. Pick another."); render(); return; }
    const ref = "PH-" + String(Date.now()).slice(-6);
    s.taken = {name, class:cls, phone, ref};
    DB.save(d); picked = "";
    document.getElementById("pdDone").innerHTML = `<div class="notice"><span class="dot" style="background:var(--mint)"></span><div><b>Booked!</b> ${U.esc(s.day)} at <b>${U.esc(s.time)}</b> for <b>${U.esc(name)}</b> (${U.esc(cls)}).<br>Booking ref: <b>${ref}</b> — show it on photo day.</div></div>`;
    document.getElementById("pdName").value = ""; document.getElementById("pdClass").value = "";
    document.getElementById("pdPhone").value = ""; document.getElementById("pdSlot").value = "";
    render(); U.toast("Photo slot booked!");
  };
  render();
})();
</script>
</body>
</html>
