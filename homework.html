<script src="assets/js/site.js?v=20260919-41"></script>
<script>
(function(){
  const db = DB.load();
  const list = [...(db.homework||[])].sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const classes = [...new Set(list.map(h=>h.class))];
  const sel = document.getElementById("hwClass");
  sel.innerHTML = '<option value="">All classes</option>' + classes.map(c=>`<option>${U.esc(c)}</option>`).join("");
  const doneMap=()=>{ try{ return JSON.parse(localStorage.getItem("treasure_hwdone")||"{}"); }catch(e){ return {}; } };
  window.tickHW=id=>{ const m=doneMap(); if(m[id])delete m[id]; else m[id]=1;
    try{ localStorage.setItem("treasure_hwdone",JSON.stringify(m)); }catch(e){} render(); };
  function render(){
    const f = sel.value, done=doneMap();
    const rows = list.filter(h=>!f||h.class===f);
    document.getElementById("hwList").innerHTML = rows.length ? rows.map(h=>`
      <div class="hw-row clip-up"><div class="avatar" style="background:${U.avatarColor(h.subject)}">${U.initials(h.subject)}</div>
        <div style="flex:1"><b>${U.esc(h.class)} — ${U.esc(h.subject)}</b><br><span>${U.esc(h.note)}</span><br><small style="color:var(--muted)">Given: ${U.prettyDate(h.date)}</small> ${done[h.id]?'<span class="badge b-green">Done ✓</span>':`<button class="icon-btn" style="font-size:.75rem" onclick="tickHW('${h.id}')">We finished it ✓</button>`}${(h.photos||[]).length?`<div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">${h.photos.map(p=>`<img src="${p}" alt="homework photo" style="width:110px;height:82px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in" onclick="window.open(this.src,'_blank')">`).join("")}</div>`:""}</div>
      </div>`).join("") : '<div class="empty">No homework posted yet. Check back soon!</div>';
  }
  sel.onchange = render; render();
})();
</script>
