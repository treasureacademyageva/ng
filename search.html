<section id="main"><div class="container" style="max-width:760px">

    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <input id="bigQ" placeholder="Type and press Enter — e.g. fees, anthem, uniform..." aria-label="Search this website" style="flex:1;min-width:200px;padding:13px 15px;border:1.5px solid var(--line);border-radius:12px;background:var(--white);color:var(--ink);font:inherit;outline:none">

<script>
(function(){
  const chips=["fees","admission","anthem","uniform","careers","support","calendar","news","results","contact"];
  document.getElementById("chips").innerHTML=chips.map(c=>`<button class="chip" onclick="quick('${c}')">${c}</button>`).join("");
  function matches(q){
    q=q.toLowerCase();
    const pages=(typeof SEARCH_INDEX!=="undefined"?SEARCH_INDEX:[]).filter(p=>(p.t+" "+p.k).toLowerCase().includes(q));
    const db=DB.load();
    const news=(db.newsEvents||[]).filter(n=>((n.title||"")+" "+(n.text||"")+" "+(n.type||"")).toLowerCase().includes(q)).slice(0,12);
    return {pages,news};
  }
  function render(q){
    const box=document.getElementById("results");
    if(!q||q.length<2){ box.innerHTML='<div class="empty">Type at least two letters, or tap a word above.</div>'; return; }
    const {pages,news}=matches(q);
    const total=pages.length+news.length;
    box.innerHTML=`<p class="sub" style="font-weight:800">${total} result${total===1?"":"s"} for “${U.esc(q)}”</p>`
      +(pages.length?'<div class="track-card" style="margin-bottom:14px"><h3 style="margin-top:0">Pages</h3>'+pages.map(p=>`<a class="notice" style="display:flex;margin-bottom:8px" href="${p.u}"><span class="dot" style="background:var(--gold)"></span><div style="flex:1"><b>${U.esc(p.t)}</b><br><small style="color:var(--muted)">${U.esc(p.u)}</small></div><span style="margin-left:auto">›</span></a>`).join("")+'</div>':"")
      +(news.length?'<div class="track-card"><h3 style="margin-top:0">News &amp; Events</h3>'+news.map(n=>`<a class="notice" style="display:flex;margin-bottom:8px" href="story.html?id=${n.id}"><span class="dot" style="background:var(--sky)"></span><div style="flex:1"><b>${U.esc(n.title)}</b> <span class="badge ${n.type==="event"?"b-coral":"b-sky"}">${n.type==="event"?"EVENT":"NEWS"}</span><br><small style="color:var(--muted)">${U.esc(n.text||"")}</small></div><span style="margin-left:auto">›</span></a>`).join("")+'</div>':"")
      +(total?"":'<div class="empty">Nothing found. Try “fees”, “anthem” or <a href="contact.html">ask us directly</a>.</div>');
    try{ localStorage.setItem("treasure_recent_search",q); }catch(e){}
  }
  window.runSearch=function(){ const q=document.getElementById("bigQ").value.trim(); render(q);
    try{ history.replaceState(null,"","search.html?q="+encodeURIComponent(q)); }catch(e){} };
  window.quick=function(c){ document.getElementById("bigQ").value=c; runSearch(); };
  document.getElementById("bigQ").addEventListener("keydown",e=>{ if(e.key==="Enter")runSearch(); });
  const q0=(new URLSearchParams(location.search).get("q")||"").trim();
  if(q0){ document.getElementById("bigQ").value=q0; render(q0); }
  else render("");
})();
</script>
