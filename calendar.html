<body data-page="calendar" data-assets="assets/">

<nav class="navbar"><div class="container">

  <div class="nav-links" id="navLinks"><div id="mainNav" style="display:contents"><a href="index.html">Home</a><a href="news.html">News/Event</a><a href="about.html">About Us</a><a href="contact.html">Contact Us</a><a href="portal/login.html" class="btn btn-mint btn-sm" style="margin-left:6px">Login/Register</a></div></div>

<div class="page-hero">
  <div class="container">
    <span class="sec-tag">Calendar</span>
    <h1>Term Calendar</h1>
    <p id="calSess">Important dates for this term — resumption, breaks, exams and closing.</p>
  </div>
</div>
<section><div class="container">
  <div id="calList"></div>
  <div style="text-align:center;margin-top:22px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
    <button class="btn btn-mint" onclick="window.print()">Print Calendar</button>
    <a class="btn btn-white" href="admissions.html">Admissions</a>
  </div>
</div></section>
<footer id="siteFooter"></footer>
<div id="toast"></div>
<script src="assets/js/store.js?v=20260919-17"></script>
<script src="assets/js/site.js?v=20260919-17"></script>
<script>
(function(){
  const db = DB.load();
  document.getElementById("calSess").textContent = (db.school.term||"") + " " + (db.school.session||"") + " — important dates: resumption, breaks, exams and closing.";
  const today = U.todayStr();
  const list = [...(db.calendar||[])].sort((a,b)=>a.date.localeCompare(b.date));
  document.getElementById("calList").innerHTML = list.length ? list.map(c=>{
    const past = c.date < today;
    return `<div class="track-card" style="${past?"opacity:.65":""}">
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
        <span class="badge ${past?"b-sky":"b-green"}">${U.prettyDate(c.date)}</span>
        ${past?"":'<span class="tag-new">UPCOMING</span>'}
        <b style="font-size:1.05rem">${U.esc(c.title)}</b>
      </div>
      ${c.desc?`<p style="margin:8px 0 0;color:var(--muted)">${U.esc(c.desc)}</p>`:""}
    </div>`; }).join("") : '<div class="empty">No dates published yet. Check back soon!</div>';
})();
</script>
</body>
</html>
