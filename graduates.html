<script>
(function(){
  const db = DB.load();
  const grads = (db.pupils||[]).filter(p=>p.class==="Graduated");
  const years = [...new Set(grads.map(p=>p.gradYear||"Past set"))].sort().reverse();
  document.getElementById("gradWall").innerHTML = grads.length ? years.map(y=>`
    <h2 style="margin-top:22px">Class of ${U.esc(String(y))}</h2>
    <div class="team-grid">${grads.filter(p=>(p.gradYear||"Past set")===y).map(p=>`
      <div class="team-card clip-up revealed">
        <span style="display:inline-flex;width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,#0E9A46,#095C2A);color:#fff;font-weight:800;font-size:1.4rem;align-items:center;justify-content:center;margin-bottom:8px">${U.initials(p.name)}</span>
        <h3 style="font-size:.95rem;margin:4px 0">${U.esc(p.name)}</h3>
        <p class="sub" style="margin:0">Primary 6 Graduate</p>
      </div>`).join("")}</div>`).join("")
    : '<div class="empty">No graduates yet — our first set is on the way!</div>';
})();
</script>
