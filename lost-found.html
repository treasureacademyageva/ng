<section id="main"><div class="container" style="max-width:820px">
  <img class="page-banner" src="assets/img/lostfound-banner.png" alt="Lost and found shelf at the school office" width="1376" height="768" loading="lazy" decoding="async">

<script src="assets/js/site.js?v=20260923-51"></script><script defer src="assets/js/auth-ui.js?v=20260923-51"></script>
<script>
(function(){
  const db = DB.load();
  const list = (db.lostfound||[]).filter(l=>!l.claimed&&!l.archived);
  const box = document.getElementById("lfList");
  box.innerHTML = list.length ? list.map(l=>`
    <div class="hw-row clip-up">${l.photo?`<img src="${l.photo}" alt="" style="width:64px;height:64px;object-fit:cover;border-radius:12px;flex:none" loading="lazy" decoding="async">`:`<div class="avatar" style="background:${U.avatarColor(l.item)}">${U.initials(l.item)}</div>`}
      <div style="flex:1"><b>${U.esc(l.item)}</b><br><span>${U.esc(l.desc||"")}</span><br><small style="color:var(--muted)">Found: ${U.prettyDate(l.date)}</small>
        <div id="claim-${l.id}" style="margin-top:8px"></div>
      </div>
      <div><button class="btn btn-sun btn-sm" onclick="claimForm('${l.id}')">This is mine</button><div id="pend-${l.id}"></div></div>
    </div>`).join("") : '<div class="empty">Nothing unclaimed right now. Well done, everyone!</div>';
  window.claimForm = function(id){
    document.getElementById("claim-"+id).innerHTML = `
      <div class="form-grid" style="margin-top:6px">
        <div class="field"><label>Your name</label><input id="cn-${id}" placeholder="Parent name"></div>
        <div class="field"><label>Phone</label><input id="cp-${id}" inputmode="tel" placeholder="080..."></div>
      </div>
      <div style="margin-top:8px"><button class="btn btn-mint btn-sm" onclick="sendClaim('${id}')">Send Claim</button></div>`;
  };
  try{ const sent=JSON.parse(localStorage.getItem("lf_sent")||"[]");
    sent.forEach(id=>{ const p=document.getElementById("pend-"+id); if(p)p.innerHTML='<span class="badge b-sun" style="margin-top:6px;display:inline-block">Claim sent — waiting for office</span>'; });
  }catch(e){}
  window.sendClaim = function(id){
    const name = document.getElementById("cn-"+id).value.trim();
    const phone = document.getElementById("cp-"+id).value.trim();
    if(!name || !phone){ U.toast("Please add your name and phone number."); return; }
    const d = DB.load(); d.claims = d.claims||[];
    d.claims.unshift({id:"CL"+Date.now(), itemId:String(id), name, phone, date:U.todayStr()});
    DB.save(d);
    try{ const sent=JSON.parse(localStorage.getItem("lf_sent")||"[]"); sent.push(String(id)); localStorage.setItem("lf_sent",JSON.stringify(sent)); }catch(e){}
    document.getElementById("claim-"+id).innerHTML = '<p style="color:var(--green);font-weight:700">Claim sent! The school office will call you.</p>';
    U.toast("Claim sent to the school office.");
  };
})();
</script>
