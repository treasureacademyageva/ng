<section><div class="container" style="max-width:820px">
  <div class="field" style="max-width:320px;margin-bottom:16px"><label>Show class</label><select id="hdClass"></select></div>
  <div id="hdList"></div>

<script src="assets/js/store.js?v=20260919-17"></script>
<script src="assets/js/site.js?v=20260919-17"></script>
<script>
(function(){
  const db = DB.load();
  const list = [...(db.holiday||[])].sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const sel = document.getElementById("hdClass");
  sel.innerHTML = '<option value="">All classes</option>' + [...new Set(list.map(h=>h.class))].map(c=>`<option>${U.esc(c)}</option>`).join("");
  function render(){
    const f = sel.value;
    const rows = list.filter(h=>!f||h.class===f);
    document.getElementById("hdList").innerHTML = rows.length ? rows.map(h=>`
      <div class="hw-row clip-up"><div class="avatar" style="background:${U.avatarColor(h.subject)}">${U.initials(h.subject)}</div>
        <div style="flex:1"><b>${U.esc(h.class)} — ${U.esc(h.subject)}</b><br><span>${U.esc(h.note)}</span><br><small style="color:var(--muted)">Given: ${U.prettyDate(h.date)}</small></div>
      </div>`).join("") : '<div class="empty">No holiday assignments yet. Enjoy the break!</div>';
  }
  sel.onchange = render; render();
})();
</script>
